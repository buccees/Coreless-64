name: Publish VIGIL Lab Report to GitHub Pages

on:
  push:
    branches:
      - vigil-spatial-awareness
    paths:
      - "index.html"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: vigil-report-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/vigil-spatial-awareness'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare report site
        run: |
          set -eux
          mkdir -p site
          cp index.html site/index.html
          test -s site/index.html

      - name: Create GitHub Pages site if necessary
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -eux
          RESPONSE=$(curl -sS -o /tmp/pages-response.json -w "%{http_code}" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/pages")
          cat /tmp/pages-response.json || true
          if [ "${RESPONSE}" = "404" ]; then
            curl -sS -f -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/${REPO}/pages" \
              -d '{"build_type":"workflow"}'
          elif [ "${RESPONSE}" -ge 200 ] && [ "${RESPONSE}" -lt 300 ]; then
            echo "Pages site already exists."
          else
            echo "Unexpected Pages API response: HTTP ${RESPONSE}"
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
