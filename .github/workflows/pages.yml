name: Publish VIGIL Lab Report to GitHub Pages

on:
  push:
    branches:
      - vigil-spatial-awareness
    paths:
      - "index.html"
      - "vigil-scylla-helicopter.js"
      - "vigil-mech-garage.js"
      - "vigil-mech-3d-view.js"
      - "vigil-submersible-3d-view.js"
      - "vigil-independent-vehicle-3d-views.js"
      - "vigil-uuv-missions.js"
      - "daedalus-rd.css"
      - "daedalus-rd.js"
      - "vigil-daedalus-orbital-sensor-suite.js"
      - "vigil-rd-labs.js"
      - "elder-scrolls-astronomy.js"
      - "nirn-gravity-model.js"
      - "nirn-coupled-world.js"
      - "vigil-celestial-world-view.js"
      - "vigil/test-nirn-coupled-world.cjs"
      - "vigil/test_seafloor_sync_ui.cjs"
      - "vigil/test-nirn-gravity.cjs"
      - "rd/plague/**"
      - "daedalus-mothership.js"
      - "vigil-fleet-sensor-network.js"
      - "vigil-rf-sensing.js"
      - "vigil-mothership-command.js"
      - "daedalus-rd-integration.js"
      - "assets/wallpapers/**"
      - "operator-display.html"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: vigil-report-pages
  cancel-in-progress: true

jobs:
  deploy:
    timeout-minutes: 15
    if: github.ref == 'refs/heads/vigil-spatial-awareness'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare report site
        run: |
          set -eux
          mkdir -p site/rd/plague
          cp index.html site/index.html
          cp vigil-mech-garage.js site/vigil-mech-garage.js
          cp vigil-mech-3d-view.js site/vigil-mech-3d-view.js
          cp vigil-scylla-helicopter.js site/vigil-scylla-helicopter.js
          cp vigil-submersible-3d-view.js site/vigil-submersible-3d-view.js
          cp vigil-independent-vehicle-3d-views.js site/vigil-independent-vehicle-3d-views.js
          cp vigil-uuv-missions.js site/vigil-uuv-missions.js
          cp daedalus-rd.css site/daedalus-rd.css
          cp daedalus-rd.js site/daedalus-rd.js
          cp vigil-daedalus-orbital-sensor-suite.js site/vigil-daedalus-orbital-sensor-suite.js
          cp vigil-rd-labs.js site/vigil-rd-labs.js
          cp elder-scrolls-astronomy.js site/elder-scrolls-astronomy.js
          cp nirn-gravity-model.js site/nirn-gravity-model.js
          cp nirn-coupled-world.js site/nirn-coupled-world.js
          cp vigil-celestial-world-view.js site/vigil-celestial-world-view.js
          cp rd/plague/vigil-plague.js site/rd/plague/vigil-plague.js
          cp daedalus-mothership.js site/daedalus-mothership.js
          cp vigil-fleet-sensor-network.js site/vigil-fleet-sensor-network.js
          cp vigil-rf-sensing.js site/vigil-rf-sensing.js
          cp vigil-mothership-command.js site/vigil-mothership-command.js
          cp daedalus-rd-integration.js site/daedalus-rd-integration.js
          cp operator-display.html site/operator-display.html
          if [ -d assets ]; then cp -R assets site/assets; fi
          test -s site/index.html
          test -s site/vigil-mech-garage.js
          test -s site/vigil-mech-3d-view.js
          test -s site/vigil-scylla-helicopter.js
          test -s site/vigil-submersible-3d-view.js
          test -s site/vigil-independent-vehicle-3d-views.js
          test -s site/vigil-uuv-missions.js
          test -s site/daedalus-rd.css
          test -s site/daedalus-rd.js
          test -s site/vigil-daedalus-orbital-sensor-suite.js
          test -s site/vigil-rd-labs.js
          test -s site/elder-scrolls-astronomy.js
          test -s site/nirn-gravity-model.js
          test -s site/nirn-coupled-world.js
          test -s site/vigil-celestial-world-view.js
          test -s site/rd/plague/vigil-plague.js
          test -s site/daedalus-mothership.js
          test -s site/vigil-fleet-sensor-network.js
          test -s site/vigil-rf-sensing.js
          test -s site/vigil-mothership-command.js
          test -s site/daedalus-rd-integration.js
          test -s site/assets/wallpapers/vigil-deepwater-command.svg
          test -s site/operator-display.html

      - name: Validate browser JavaScript
        run: |
          set -eux
          for script in \
            site/vigil-mech-garage.js \
            site/vigil-mech-3d-view.js \
            site/vigil-scylla-helicopter.js \
            site/vigil-submersible-3d-view.js \
            site/vigil-independent-vehicle-3d-views.js \
            site/vigil-uuv-missions.js \
            site/daedalus-rd.js \
            site/vigil-daedalus-orbital-sensor-suite.js \
            site/vigil-rd-labs.js \
            site/elder-scrolls-astronomy.js \
            site/nirn-gravity-model.js \
            site/nirn-coupled-world.js \
            site/rd/plague/vigil-plague.js \
            site/daedalus-mothership.js \
            site/vigil-fleet-sensor-network.js \
            site/vigil-rf-sensing.js \
            site/vigil-mothership-command.js \
            site/daedalus-rd-integration.js; do
            node --check "$script"
          done

      - name: Test per-vehicle 3D pilot launch routing and sensor-view contracts
        run: node vigil/test_seafloor_sync_ui.cjs

      - name: Test Nirn gravitational mechanics
        run: node vigil/test-nirn-gravity.cjs

      - name: Test coupled inertial and surface-frame mechanics
        run: node vigil/test-nirn-coupled-world.cjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
