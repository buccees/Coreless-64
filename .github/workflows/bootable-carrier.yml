name: Coreless bootable carrier image
run-name: Bootable Coreless carrier / ${{ github.ref_name }}

# Avoid wasting runner time on obsolete image builds after a newer push.
concurrency:
  group: coreless-carrier-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - vigil-spatial-awareness
    paths:
      - "scripts/build-bootable-ssd.sh"
      - "scripts/validate-bootable-ssd.sh"
      - "scripts/coreless-console.py"
      - "deploy/coreless-machine.service"
      - "reference/local_operator_server.py"
      - "reference/test_local_operator_server.py"
      - "specification/bootable_carrier.md"
      - ".github/workflows/bootable-carrier.yml"

jobs:
  build-uefi-image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install image build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap parted dosfstools e2fsprogs rsync util-linux qemu-system-x86 ovmf
      - name: Validate build entrypoints
        run: |
          bash -n scripts/build-bootable-ssd.sh
          python -m py_compile scripts/coreless-console.py
      - name: Build UEFI x86_64 disk image
        run: bash scripts/build-bootable-ssd.sh "$RUNNER_TEMP/coreless-uefi-x86_64.img"
      - name: Validate built image offline
        run: bash scripts/validate-bootable-ssd.sh "$RUNNER_TEMP/coreless-uefi-x86_64.img"
      - name: Smoke-test Coreless machine console and persistent image
        env:
          CORELESS_VIGIL_DB: ${{ runner.temp }}/vigil-smoke.sqlite3
        run: |
          set -euo pipefail
          IMAGE="$RUNNER_TEMP/coreless-machine-smoke.json"
          printf ':status\n:shutdown\n' | timeout 30s python scripts/coreless-console.py "$IMAGE" >"$RUNNER_TEMP/coreless-console-first.log"
          grep -q "CORELESS-64 MACHINE CONSOLE" "$RUNNER_TEMP/coreless-console-first.log"
          grep -q "Coreless machine state persisted" "$RUNNER_TEMP/coreless-console-first.log"
          test -s "$IMAGE"
          printf ':status\n:shutdown\n' | timeout 30s python scripts/coreless-console.py "$IMAGE" >"$RUNNER_TEMP/coreless-console-resume.log"
          grep -q "CORELESS-64 MACHINE CONSOLE" "$RUNNER_TEMP/coreless-console-resume.log"
          grep -q "Coreless machine state persisted" "$RUNNER_TEMP/coreless-console-resume.log"
          echo "PASS: Coreless console started, persisted the machine image, and reopened it in a fresh process."
      - name: Boot image under QEMU with UEFI
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="$RUNNER_TEMP/coreless-uefi-x86_64.img"
          # Firmware package layouts differ across Ubuntu runner images.
          # Search installed firmware files rather than relying on package ownership.
          OVMF_CODE="$(find /usr/share /usr/lib -type f -iname 'OVMF_CODE*.fd' -print -quit 2>/dev/null || true)"
          if [[ -z "$OVMF_CODE" ]]; then
            OVMF_CODE="$(find /usr/share /usr/lib -type f -iname 'OVMF.fd' -print -quit 2>/dev/null || true)"
          fi
          if [[ -z "$OVMF_CODE" || ! -s "$OVMF_CODE" ]]; then
            echo "OVMF firmware code file not found; installed package contents:" >&2
            dpkg -L ovmf >&2 || true
            find /usr/share /usr/lib -iname '*ovmf*' -o -iname '*edk2*' >&2 || true
            exit 1
          fi
          # OVMF is a UEFI pflash image, not a legacy PC BIOS image. Pair its
          # code and variable-store files and give QEMU a writable vars copy.
          OVMF_DIR="${OVMF_CODE%/*}"
          OVMF_SUFFIX="${OVMF_CODE##*OVMF_CODE}"
          OVMF_VARS="$OVMF_DIR/OVMF_VARS$OVMF_SUFFIX"

          # Ubuntu's OVMF package may ship secure-boot CODE firmware without
          # a correspondingly named VARS template. Prefer an exact pair, then
          # a same-size 4 MiB template, and finally the generic template.
          if [[ ! -s "$OVMF_VARS" ]]; then
            for candidate in \
              "$OVMF_DIR/OVMF_VARS_4M.fd" \
              "$OVMF_DIR/OVMF_VARS_4M.ms.fd" \
              "$OVMF_DIR/OVMF_VARS.fd"; do
              if [[ -s "$candidate" ]]; then
                OVMF_VARS="$candidate"
                break
              fi
            done
          fi
          if [[ ! -s "$OVMF_VARS" ]]; then
            OVMF_VARS="$(find /usr/share /usr/lib -type f \\( -iname 'OVMF_VARS_4M*.fd' -o -iname 'OVMF_VARS.fd' \\) -print -quit 2>/dev/null || true)"
          fi
          if [[ -z "$OVMF_VARS" || ! -s "$OVMF_VARS" ]]; then
            echo "Compatible OVMF variable-store image not found for $OVMF_CODE" >&2
            dpkg -L ovmf >&2 || true
            find /usr/share /usr/lib -type f -iname '*OVMF*VARS*.fd' >&2 || true
            exit 1
          fi
          OVMF_VARS_COPY="$RUNNER_TEMP/OVMF_VARS.fd"
          cp "$OVMF_VARS" "$OVMF_VARS_COPY"
          echo "Using UEFI firmware code: $OVMF_CODE"
          echo "Using writable UEFI variable store: $OVMF_VARS_COPY"

          # Place an explicit opt-in marker on the dedicated state partition.
          # The guest console uses it to save a deterministic virtual CPU/RAM
          # fixture on boot one and assert those exact values on boot two.
          RECOVERY_LOOP="$(sudo losetup --find --show --partscan "$IMAGE")"
          sudo partprobe "$RECOVERY_LOOP" 2>/dev/null || true
          for _ in $(seq 1 20); do [[ -b "${RECOVERY_LOOP}p3" ]] && break; sleep 0.25; done
          [[ -b "${RECOVERY_LOOP}p3" ]] || { echo "State partition device missing for recovery fixture" >&2; exit 1; }
          STATE_MOUNT="$RUNNER_TEMP/coreless-state"
          mkdir -p "$STATE_MOUNT"
          sudo mount "${RECOVERY_LOOP}p3" "$STATE_MOUNT"
          printf 'enabled\n' | sudo tee "$STATE_MOUNT/.recovery-test" >/dev/null
          sudo sync
          sudo umount "$STATE_MOUNT"
          sudo losetup -d "$RECOVERY_LOOP"

          set +e
          timeout 60s qemu-system-x86_64 \
            -machine q35 -m 2048 -smp 2 \
            -drive "if=pflash,format=raw,readonly=on,file=$OVMF_CODE" \
            -drive "if=pflash,format=raw,file=$OVMF_VARS_COPY" \
            -drive "file=$IMAGE,format=raw,if=virtio" \
            -display none -serial stdio -monitor none -no-reboot \
            >"$RUNNER_TEMP/qemu-boot.log" 2>&1
          QEMU_STATUS=$?
          set -e
          cat "$RUNNER_TEMP/qemu-boot.log"
          if [[ $QEMU_STATUS -ne 0 && $QEMU_STATUS -ne 124 ]]; then
            echo "QEMU exited unexpectedly with status $QEMU_STATUS" >&2
            exit "$QEMU_STATUS"
          fi
          grep -Eqi "Reached target Multi-User System|Reached target.*Multi-User" "$RUNNER_TEMP/qemu-boot.log" || {
            echo "UEFI VM did not report reaching multi-user target" >&2
            exit 1
          }
          grep -Fq "CORELESS-64 MACHINE CONSOLE" "$RUNNER_TEMP/qemu-boot.log" || {
            echo "UEFI VM reached multi-user target, but Coreless console startup was not observed" >&2
            exit 1
          }
          grep -Fq "Persistent machine image: /var/lib/coreless/coreless.img" "$RUNNER_TEMP/qemu-boot.log" || {
            echo "Coreless console did not confirm the SSD-backed machine image path" >&2
            exit 1
          }
          grep -Fq "Persistent machine state: initialized new image" "$RUNNER_TEMP/qemu-boot.log" || {
            echo "First UEFI boot did not report initialization of a fresh Coreless machine image" >&2
            exit 1
          }
          grep -Fq "Recovery fixture saved: r7=37 pc=260 ram=434f52454c455353" "$RUNNER_TEMP/qemu-boot.log" || {
            echo "First UEFI boot did not persist the expected Coreless CPU/RAM recovery fixture" >&2
            exit 1
          }

          # Simulate a power cycle by stopping QEMU after Coreless has saved
          # its boot state, then boot the exact same disk image again.
          set +e
          timeout 60s qemu-system-x86_64 \
            -machine q35 -m 2048 -smp 2 \
            -drive "if=pflash,format=raw,readonly=on,file=$OVMF_CODE" \
            -drive "if=pflash,format=raw,file=$OVMF_VARS_COPY" \
            -drive "file=$IMAGE,format=raw,if=virtio" \
            -display none -serial stdio -monitor none -no-reboot \
            >"$RUNNER_TEMP/qemu-recovery.log" 2>&1
          RECOVERY_QEMU_STATUS=$?
          set -e
          cat "$RUNNER_TEMP/qemu-recovery.log"
          if [[ $RECOVERY_QEMU_STATUS -ne 0 && $RECOVERY_QEMU_STATUS -ne 124 ]]; then
            echo "QEMU recovery boot exited unexpectedly with status $RECOVERY_QEMU_STATUS" >&2
            exit "$RECOVERY_QEMU_STATUS"
          fi
          grep -Eqi "Reached target Multi-User System|Reached target.*Multi-User" "$RUNNER_TEMP/qemu-recovery.log" || {
            echo "Recovery boot did not reach the multi-user target" >&2
            exit 1
          }
          grep -Fq "Persistent machine state: restored existing state" "$RUNNER_TEMP/qemu-recovery.log" || {
            echo "Recovery boot did not restore the machine state saved on the first boot" >&2
            exit 1
          }
          grep -Fq "Recovery fixture restored: r7=37 pc=260 ram=434f52454c455353" "$RUNNER_TEMP/qemu-recovery.log" || {
            echo "Recovery boot did not restore the exact virtual CPU register, PC, and RAM sentinel" >&2
            exit 1
          }
          grep -Fq "Persistent machine image: /var/lib/coreless/coreless.img" "$RUNNER_TEMP/qemu-recovery.log" || {
            echo "Recovery boot did not reopen the same persistent machine image" >&2
            exit 1
          }
          echo "PASS: UEFI boot reached multi-user and restored the exact Coreless CPU register, PC, and RAM sentinel after a simulated power cycle."
      - name: Publish bootable image artifact (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: coreless-uefi-x86_64
          path: ${{ runner.temp }}/coreless-uefi-x86_64.img
          if-no-files-found: error
          retention-days: 7
