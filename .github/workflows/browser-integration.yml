name: VIGIL browser integration
run-name: VIGIL browser integration / ${{ github.ref_name }}

on:
  workflow_dispatch:

jobs:
  browser-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright Chromium
        run: |
          npm install --prefix /tmp/vigil-playwright playwright
          /tmp/vigil-playwright/node_modules/.bin/playwright install --with-deps chromium
      - name: Run VIGIL browser integration
        env:
          NODE_PATH: /tmp/vigil-playwright/node_modules
        run: node vigil/test_spatial_browser.cjs
