name: VIGIL browser integration
run-name: VIGIL browser integration / ${{ github.ref_name }}

on:
  workflow_dispatch:

jobs:
  browser-integration:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright runner only
        run: npm install --prefix /tmp/vigil-playwright playwright@1.58.2
      - name: Run VIGIL browser integration
        env:
          NODE_PATH: /tmp/vigil-playwright/node_modules
        run: node vigil/test_spatial_browser.cjs
