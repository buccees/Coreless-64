name: Coreless reference tests
run-name: Coreless tests / ${{ github.event_name }} / ${{ github.ref_name }}

on:
  push:
  pull_request:

jobs:
  reference-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Check bootable carrier entrypoints
        run: |
          bash -n scripts/build-bootable-ssd.sh
          python -m py_compile scripts/coreless-console.py
          python -m py_compile vigil/multiplayer.py vigil/multiplayer_http.py vigil/multiplayer_server.py vigil/regional_world.py vigil/regional_world_http.py vigil/regional_game.py
      - name: Run reference tests
        working-directory: reference
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q
      - name: Run VIGIL spatial and shared-Qwen3 tests
        working-directory: reference
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q ../vigil/test_blueprint.py ../vigil/test_positioning.py ../vigil/test_gps.py ../vigil/test_ai.py ../vigil/test_terminal.py ../vigil/test_workspace.py ../vigil/test_blueprint_view.py ../vigil/test_building.py ../vigil/test_object_tracking.py ../vigil/test_sensor_adapters.py ../vigil/test_underwater.py ../vigil/test_sensor_event.py ../vigil/test_sensor_event_adapter.py ../vigil/test_sensor_event_api.py ../vigil/test_sensor_event_runner.py ../vigil/test_sensor_fusion.py ../vigil/test_sensor_time_alignment.py ../vigil/test_raster_calibration.py ../vigil/test_infrared_floor_mapping.py ../vigil/test_multimodal_fusion.py ../vigil/test_spatial_import_contract.py ../vigil/test_multiplayer.py ../vigil/test_multiplayer_http.py ../vigil/test_regional_world.py ../vigil/test_regional_world_http.py ../vigil/test_regional_game.py ../vigil/test_ship_catalog.py
      - name: Run VIGIL spatial review logic scenarios
        run: node vigil/test_spatial_review_logic.cjs
