name: Coreless reference tests
run-name: Coreless tests / ${{ github.event_name }} / ${{ github.ref_name }}

on:
  push:
  pull_request:

jobs:
  reference-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Check bootable carrier entrypoints
        run: |
          bash -n scripts/build-bootable-ssd.sh
          python -m py_compile scripts/coreless-console.py
      - name: Run reference tests
        working-directory: reference
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q
      - name: Run VIGIL campaign survey persistence and API tests
        working-directory: reference
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q ../vigil/test_seafloor_campaign_store.py ../reference/test_local_operator_server.py -k seafloor
      - name: Run VIGIL spatial and shared-Qwen3 tests
        working-directory: reference
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q ../vigil/test_blueprint.py ../vigil/test_positioning.py ../vigil/test_gps.py ../vigil/test_ai.py ../vigil/test_terminal.py ../vigil/test_workspace.py ../vigil/test_blueprint_view.py ../vigil/test_building.py ../vigil/test_object_tracking.py ../vigil/test_sensor_adapters.py ../vigil/test_raster_calibration.py ../vigil/test_infrared_floor_mapping.py ../vigil/test_multimodal_fusion.py ../vigil/test_spatial_import_contract.py
      - name: Run VIGIL spatial review logic scenarios
        run: node vigil/test_spatial_review_logic.cjs
