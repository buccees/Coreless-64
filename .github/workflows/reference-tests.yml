name: Coreless reference tests

on:
  push:
  pull_request:

jobs:
  reference-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run reference tests
        working-directory: reference
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q
      - name: Run VIGIL spatial and shared-Qwen3 tests
        working-directory: reference
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q ../vigil/test_blueprint.py ../vigil/test_positioning.py ../vigil/test_gps.py ../vigil/test_ai.py
